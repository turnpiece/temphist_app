name: Android Build (Flutter)

# Guards the Android target: analyze, test and build the release app bundle on
# the same Flutter SDK that produces shipped binaries. Needs no secrets --
# android/app/google-services.json and lib/firebase_options.dart are tracked, and
# without android/key.properties (gitignored) the bundle falls back to the debug
# key, so the output is a build check, not a releasable artifact. Play uploads
# stay manual.

on:
  pull_request:
    paths:
      - "android/**"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v5

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🚀 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: 🔍 Check Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔎 Analyze
        run: flutter analyze

      - name: 🧪 Run tests
        run: flutter test

      - name: 🏗️ Build release app bundle
        run: flutter build appbundle --release
