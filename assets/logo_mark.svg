<svg width="33" height="28" viewBox="0 10 33 28" xmlns="http://www.w3.org/2000/svg">

  <!-- The bars of logo.svg, cropped to their bounds so the mark centres on
       what is drawn. Used by the splash screen, which must line up with the
       native iOS launch image (ios/Runner/Assets.xcassets/LaunchImage). -->
  <rect x="0" y="10" width="15" height="3" fill="#3B82F6" />
  <rect x="0" y="15" width="28" height="3" fill="#E45A52" />
  <rect x="0" y="20" width="21" height="3" fill="#8E8E93" />
  <rect x="0" y="25" width="33" height="3" fill="#FF3B30" />
  <rect x="0" y="30" width="17" height="3" fill="#5E86D6" />
  <rect x="0" y="35" width="25" height="3" fill="#B67773" />
</svg>
